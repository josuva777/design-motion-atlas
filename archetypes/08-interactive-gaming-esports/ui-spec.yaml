# ui-spec.yaml — Machine-Verified Contract for 08-interactive-gaming-esports
# Verified automatically via `npm run audit:spec` (node scripts/verify-spec.mjs)
version: "3.0"
archetype: "08-interactive-gaming-esports"
title: "Interactive Gaming, Worldbuilding & Esports HUD"

layout_constraints:
  grid_columns: 12
  max_border_radius_px: 2
  min_whitespace_ratio: 0.24
  max_line_measure_ch: 65
  minimum_touch_target_px: 44

tokens:
  canvas: "oklch(0.09 0.015 240)"
  elevated: "oklch(0.14 0.02 240)"
  ink_primary: "oklch(0.96 0.01 200)"
  ink_muted: "oklch(0.60 0.02 240)"
  accent_primary: "oklch(0.78 0.18 145)"
  border_hairline: "oklch(0.26 0.03 220)"
  font_display: "Panchang"
  font_sans: "General Sans"
  font_mono: "Steps-Mono"
  tabular_numerals_required: true

components:
  required_atlas_blocks:
    - "blocks/hero-stage/ScrollPinnedHeroStage.tsx"
    - "blocks/in-app-feedback/DynamicStatusIslandToast.tsx"
  required_interactive_states:
    - "default"
    - "hover"
    - "focus-visible"
    - "active"
    - "disabled"
    - "loading"
    - "empty"
    - "error"
  forbidden_archetype_patterns:
    - "corporate-white-cards"
    - "generic-bootstrap-navbars"
    - "un-animated-stat-tables"

motion:
  scroll_engine: "lenis + gsap-scrolltrigger"
  duration_min_ms: 140
  duration_max_ms: 420
  primary_easing: "cubic-bezier(0.16, 1, 0.3, 1)"
  scroll_trigger_start: "top 85%"
  allowed_animated_properties: ["transform", "opacity", "clip-path"]
  forbidden_animated_properties: ["top", "left", "width", "height", "margin", "box-shadow"]

accessibility:
  standard: "WCAG-2.2-AA"
  min_normal_text_contrast: 4.5
  min_large_text_contrast: 3.0

quality_gates:
  - id: "zero-slop-scanner"
    command: "node scripts/detect-slop.mjs"
    expected_exit_code: 0
  - id: "spec-contract-verifier"
    command: "node scripts/verify-spec.mjs"
    expected_exit_code: 0
