# reference-index/curated-sources.yaml
# Master 100% Free-First Reference Ecosystem (42+ Sources across 10 Domains)
# AI agents read this catalog + `custom-sources.yaml` to select 3-4 distinct DNA sources per project.

version: "3.0"
policy: "ALWAYS prefer 100% free open-source tools (npx -y designlang@13.3.2, npx -y dembrandt@1.4.0, ffmpeg) and MIT/free component registries."

categories:
  art_experimental_and_culture:
    description: "Use when building for artists, creative directors, studios, exhibitions, fashion, or avant-garde brands so the UI never looks corporate."
    sources:
      - name: "Cosmos"
        url: "https://www.cosmos.so/explore"
        sub_collections:
          - "https://www.cosmos.so/explore/art"
          - "https://www.cosmos.so/explore/graphic-design"
          - "https://www.cosmos.so/public-work"
        cost: "100% Free"
        extract_focus: "Curated art direction, editorial photography framing, tactile textures, and non-AI visual moodboards (includes 100,000+ public-domain artworks via Public Work)."
      - name: "Savee"
        url: "https://savee.com/"
        cost: "Free browsing"
        extract_focus: "High-fashion graphic rhythm, poster-inspired web grids, and bold color blocking."
      - name: "Brutalist Websites"
        url: "https://brutalistwebsites.com/"
        cost: "100% Free"
        extract_focus: "Raw HTML structure, exposed borders, anti-template spatial tension, kinetic marquees, and experimental navigation."
      - name: "Minimal Gallery"
        url: "https://minimal.gallery/websites/"
        sub_collections:
          - "https://minimal.gallery/tag/portfolio/"
        cost: "100% Free"
        extract_focus: "Swiss typographic precision, gallery-grade whitespace (>35% open canvas), and restrained monochrome/stone palettes."
      - name: "Httpster"
        url: "https://httpster.net/"
        cost: "100% Free"
        extract_focus: "Indie creative studio websites, expressive type pairings, and unconventional asymmetrical layouts."
      - name: "Curated Design"
        url: "https://curated.design/"
        cost: "100% Free"
        extract_focus: "Hand-reviewed live creative websites with direct click-through URLs ready for `npm run extract:url` extraction."

  immersive_motion_and_webgl:
    description: "Use when building flagship launches, 3D product configurators, scrollytelling narratives, and interactive shaders."
    sources:
      - name: "Awwwards Sites of the Day (SOTD)"
        url: "https://www.awwwards.com/websites/sites_of_the_day/"
        sub_collections:
          - "https://www.awwwards.com/collections/"
        cost: "100% Free to browse & extract live URLs"
        extract_focus: "GSAP ScrollTrigger pinning, SplitText reveals, WebGL canvas transitions, and custom cursor choreography."
      - name: "Godly"
        url: "https://godly.design/websites/"
        cost: "100% Free"
        extract_focus: "Kinetic web design, fluid micro-interactions, interactive bentos, and sub-second hover physics."
      - name: "HorizonX"
        url: "https://horizonx.so/"
        cost: "Free browsing & interactive shader/template reference library"
        extract_focus: "WebGL 2 shaders (orbs, fluid displacement), Lenis smooth-scroll templates, and 8-state UI kits."
      - name: "Lenis Showcase"
        url: "https://lenis.dev/showcase"
        cost: "100% Free & Open Source (MIT)"
        extract_focus: "Butter-smooth momentum scroll pacing (`lerp: 0.085`) paired with pinned canvas sequences."
      - name: "GSAP Showcase"
        url: "https://gsap.com/showcase/"
        cost: "100% Free (GSAP is 100% free including all plugins like SplitText & ScrollTrigger)"
        extract_focus: "Timeline sequencing, SVG morphing, Flip layout transitions, and ScrollTrigger scrub math."
      - name: "PMND.rs Market & Three.js Resources"
        url: "https://threejsresources.com/tool/market-pmnd-rs"
        cost: "Free & Open-Source Three.js / React Three Fiber assets"
        extract_focus: "Ready-to-use 3D models, materials, shaders, and R3F post-processing pipelines."

  business_saas_and_landing_pages:
    description: "Use when building B2B SaaS, fintech platforms, developer tools, AI startups, and high-converting marketing pages."
    sources:
      - name: "MaxiBestOf"
        url: "https://maxibestof.one/"
        cost: "100% Free"
        extract_focus: "Deconstructs live websites by individual page sections AND lists the exact fonts used on every site."
      - name: "Lapa Ninja"
        url: "https://www.lapa.ninja/"
        sub_collections:
          - "https://www.lapa.ninja/category/business/"
          - "https://www.lapa.ninja/category/agency/"
        cost: "100% Free (7,500+ full-page landing pages)"
        extract_focus: "Above-the-fold value proposition framing, interactive feature walkthroughs, and pricing table alternatives."
      - name: "Land-book"
        url: "https://land-book.com/design/landing-page"
        cost: "100% Free"
        extract_focus: "SaaS hero hierarchy, clean editorial product storytelling, and trust-building layout rhythm."
      - name: "Landing Love"
        url: "https://www.landing.love/"
        cost: "100% Free"
        extract_focus: "Video-captured animated landing pages demonstrating scroll choreography and hero transitions."
      - name: "One Page Love"
        url: "https://onepagelove.com/genre/landing-page"
        cost: "100% Free"
        extract_focus: "2,000+ single-page narrative architectures with annotated feature breakdowns."

  product_apps_and_dashboards:
    description: "Use when building multi-screen web applications, SaaS dashboards, onboarding flows, settings pages, and mobile apps."
    sources:
      - name: "Refero"
        url: "https://refero.design/web-apps"
        sub_collections:
          - "https://refero.design/apps/search"
        cost: "Free browsing"
        extract_focus: "Real production web and iOS app interfaces, command palettes, data tables, and multi-step user flows."
      - name: "Mobbin (Web & Mobile)"
        url: "https://mobbin.com/explore/web"
        sub_collections:
          - "https://mobbin.com/explore/mobile"
        cost: "Free exploration tier"
        extract_focus: "300,000+ real-world app screens covering empty states, loading skeletons, modals, and checkout flows."
      - name: "Page Flows"
        url: "https://pageflows.com/"
        cost: "Free previews"
        extract_focus: "End-to-end interaction recordings of onboarding, upgrading, and task completion flows."

  open_source_component_registries:
    description: "Install directly via CLI or MCP, then apply the 3-Mutation Rule (override tokens, fonts, and easing)."
    sources:
      - name: "21st.dev Community Registry"
        url: "https://21st.dev/community/components"
        mcp_url: "https://21st.dev/mcp"
        cost: "Free & Open-Source Community Catalog (12,000+ components)"
        install_cmd: "npx -y @21st-dev/cli@0.2.0 add <component>"
        extract_focus: "Tactile React + Tailwind + Radix components with polished hover/focus micro-interactions."
      - name: "React Bits"
        url: "https://reactbits.dev/"
        cost: "100+ Free & Open-Source Components"
        extract_focus: "Kinetic text animations (split, blur, scramble), interactive canvas/WebGL backgrounds, and cursor effects."
      - name: "Motion Primitives"
        url: "https://github.com/ibelick/motion-primitives"
        cost: "100% Free & Open Source (MIT)"
        extract_focus: "Composable Framer Motion primitives: Morphing Dialogs, Magnetic buttons, Progressive Blur, Text Shimmer, and Docks."
      - name: "Origin UI"
        url: "https://github.com/shadcn/originui"
        cost: "100% Free & Open Source (MIT)"
        extract_focus: "Hundreds of high-craft application UI inputs, buttons, date pickers, and form controls built on OKLCH tokens."
      - name: "Cult UI"
        url: "https://www.cult-ui.com/docs"
        cost: "154 Free & Open-Source Components (MIT)"
        extract_focus: "AI prompt composers, Halo form controls, device mockups, Kanban boards, and Vercel AI SDK blocks."
      - name: "Fancy Components"
        url: "https://www.fancycomponents.dev/"
        cost: "100% Free & Open Source"
        extract_focus: "Playful, artistic React components: marquee along SVG paths, gravity physics, and kinetic type."
      - name: "Skiper UI"
        url: "https://skiper-ui.com/components"
        cost: "Free components + shadcn CLI install"
        extract_focus: "Uncommon Apple-style scrollbars, 3D parallax text scroll effects, and animated counters."
      - name: "Made for Award"
        url: "https://www.madeforaward.com/"
        cost: "Free snippets & GSAP patterns"
        extract_focus: "Choreographed GSAP ScrollTrigger page transitions, image reveal curtains, and magnetic sliders."
      - name: "Bundui"
        url: "https://bundui.io/"
        cost: "Free open-source UI blocks (github.com/bundui)"
        extract_focus: "Dashboard widgets, metric cards, and Tailwind + Framer Motion blocks."
      - name: "Uiverse"
        url: "https://uiverse.io/elements"
        cost: "100% Free & Open Source (4,500+ CSS/Tailwind elements)"
        extract_focus: "Pure CSS and Tailwind micro-interactions for buttons, toggles, loaders, and tactile switches."
      - name: "Aceternity UI & Magic UI"
        url: "https://ui.aceternity.com/components"
        sub_collections:
          - "https://magicui.design/docs/components"
        cost: "Free core components (200+)"
        extract_focus: "Spotlight cards, 3D marquees, and beams (CRITICAL: always strip default colors/radii to avoid P1 tells)."

  free_commercial_typography:
    description: "Every project must load distinctive, 100% free commercial-use fonts from these foundries instead of P0 system defaults."
    sources:
      - name: "Fontshare (by Indian Type Foundry)"
        url: "https://www.fontshare.com/"
        cost: "100% Free for Personal & Commercial Use"
        recommended_pairings:
          - "Cabinet Grotesk (Display) + Satoshi (UI Sans)"
          - "Clash Display (Monumental) + General Sans (Clean Body)"
          - "Zodiak (Editorial Serif) + Switzer (Swiss Neo-Grotesk)"
          - "Panchang (Wide Spatial Display) + Ranade (Humanist Sans)"
      - name: "UNCUT.wtf"
        url: "https://uncut.wtf/"
        cost: "100% Free for Commercial Use (163+ contemporary typefaces)"
        recommended_pairings:
          - "Uncut Sans (Variable Neo-Grotesk) + Fragment Mono / Commit Mono"
          - "Libertinage / Ortica (Expressive Art Serif) + Plus Jakarta Sans"
          - "Basteleur / Solide Mirage (Avant-Garde Display) + Necto Mono"
      - name: "Velvetyne Type Foundry"
        url: "https://velvetyne.fr/"
        cost: "100% Free & Libre Open-Source Fonts"
        recommended_pairings:
          - "Le Murmure / Trickster / Outward (Experimental Art & Brutalist Headlines)"
      - name: "Fonts In Use"
        url: "https://fontsinuse.com/"
        cost: "100% Free Archive"
        extract_focus: "Real-world historical and contemporary typographic pairings indexed by industry and format."

  agentic_ui_protocols:
    description: "Use when embedding AI agents inside websites or apps so you never ship a generic corner chat bubble."
    sources:
      - name: "AG-UI Protocol (Agent-User Interaction)"
        url: "https://docs.ag-ui.com/introduction"
        repo: "https://github.com/ag-ui-protocol/ag-ui"
        cost: "100% Free & Open Standard"
        extract_focus: "Real-time SSE event streaming between backend agents and frontend interactive components."
      - name: "CopilotKit"
        url: "https://github.com/CopilotKit/CopilotKit"
        cost: "100% Free & Open Source (MIT)"
        extract_focus: "Controlled Generative UI (`useCopilotAction`, `useCopilotReadable`) rendering your exact vault React components."
      - name: "Google A2UI"
        url: "https://github.com/a2ui-project/a2ui"
        cost: "100% Free & Open Source (Apache 2.0)"
        extract_focus: "Declarative JSON streaming specification for safe cross-platform multi-agent UI rendering."
      - name: "OpenUI"
        url: "https://github.com/thesysdev/openui"
        cost: "100% Free & Open Source"
        extract_focus: "Token-efficient streaming generative UI specifications."
